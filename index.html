    <script>
      // Filter out noisy errors injected by third-party browser extensions (e.g. MetaMask, web3 wallets)
      (function() {
        var isExtensionError = function(msg, url, stack) {
          var str = ((msg || '') + ' ' + (url || '') + ' ' + (stack || '')).toLowerCase();
          return str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('moz-extension://') !== -1 ||
                 str.indexOf('safari-extension://') !== -1 ||
                 str.indexOf('metamask') !== -1 ||
                 str.indexOf('failed to connect to metamask') !== -1 ||
                 str.indexOf('inpage.js') !== -1;
        };

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename, event.error ? event.error.stack : '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var stack = reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : String(reason);
          if (isExtensionError(stack, '', stack)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
